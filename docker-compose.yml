version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: softskills_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: softskills
      POSTGRES_PASSWORD: softskills_pass
      POSTGRES_DB: softskills
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U softskills']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: softskills_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://softskills:softskills_pass@postgres:5432/softskills
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      PORT: 3001
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      YOOMONEY_RECEIVER: ${YOOMONEY_RECEIVER}
      YOOMONEY_SECRET: ${YOOMONEY_SECRET}
      YOOMONEY_REDIRECT_URL: ${YOOMONEY_REDIRECT_URL:-http://localhost:5173/payment/success}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    ports:
      - '3001:3001'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: softskills_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  postgres_data:
